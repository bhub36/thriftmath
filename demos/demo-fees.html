<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Avenir Next','Helvetica Neue',sans-serif; background:#FAF4EF; color:#1C2126;
       display:flex; align-items:center; justify-content:center; min-height:100vh; }
.demo { width:min(96vw, 680px); }
.cap { font-size:14px; font-weight:700; color:#6E7681; letter-spacing:1px; margin-bottom:10px; }
.cap span { color:#B87F14; }
.sheet { background:#fff; border-radius:12px; box-shadow:0 14px 36px rgba(82,37,75,.22); overflow:hidden; }
.bar { background:#52254B; padding:10px 16px; color:#fff; font-size:14px; font-weight:600; display:flex; gap:9px; align-items:center; }
.dot { width:10px; height:10px; border-radius:50%; background:#EFA92E; }
table { width:100%; border-collapse:collapse; font-size:14.5px; }
th { background:#6E3A64; color:#fff; padding:9px 12px; text-align:left; font-weight:600; }
td { padding:8px 12px; border-bottom:1px solid #F2E8F0; }
tr.new-row { animation:pop .45s ease; }
@keyframes pop { from { background:#FBF0DC; } to { background:transparent; } }
.pos { color:#52254B; font-weight:700; } .gold { color:#B87F14; font-weight:700; }
.kpis { display:flex; gap:12px; margin-top:14px; }
.kpi { background:#fff; border-radius:10px; padding:12px 16px; flex:1; box-shadow:0 8px 20px rgba(82,37,75,.13); }
.kpi .l { font-size:10.5px; color:#6E7681; font-weight:700; letter-spacing:.8px; }
.kpi .v { font-size:26px; color:#52254B; font-weight:700; margin-top:2px; }
.foot { margin-top:10px; font-size:12px; color:#6E7681; text-align:center; }
</style></head><body>
<div class="demo">
<div class="cap">LIVE DEMO — <span>log the sale, the right fee applies itself</span></div>
<div class="sheet"><div class="bar"><span class="dot"></span>Sales — Reseller HQ fee engine</div>
<table id="t"><tr><th>Item</th><th>Platform</th><th>Sold</th><th>Fees</th><th>Cost</th><th>Profit</th></tr></table></div>
<div class="kpis">
<div class="kpi"><div class="l">REVENUE</div><div class="v" id="k0">—</div></div>
<div class="kpi"><div class="l">FEES PAID</div><div class="v" id="k1" style="color:#C0392B">—</div></div>
<div class="kpi"><div class="l">PROFIT</div><div class="v gold" id="k2">—</div></div>
</div>
<div class="foot">Poshmark's under-$15 rule, Facebook's $0.80 minimum, TikTok's 6% — all built in. You just type the sale.</div>
</div>
<script>
const S=[["Levi's 501s","Poshmark",42,3.20],["Vintage Pyrex","FB local (cash)",35,4.00],
["Nike windbreaker","TikTok Shop",29,3.20],["Board game lot","Mercari",24,5.00],
["Y2K sunglasses","Poshmark",12,1.50],["Lego bin haul lot","eBay",65,18.00],
["Cast iron skillet","FB local (cash)",28,6.00],["Denim jacket","TikTok Shop",48,4.10]];
function fee(pf,amt){ if(pf==="Poshmark")return amt<15?2.95:amt*0.2;
  if(pf.startsWith("FB local"))return 0; if(pf==="TikTok Shop")return amt*0.06;
  if(pf==="Mercari")return amt*0.10; if(pf==="eBay")return amt*0.136+0.40; return 0; }
const $=x=>"$"+x.toFixed(2);
function render(step,animate){
  const t=document.getElementById('t');
  while(t.rows.length>1)t.deleteRow(1);
  let rev=0,fees=0,prof=0;
  for(let i=0;i<=step&&i<S.length;i++){
    const [item,pf,amt,cost]=S[i]; const f=fee(pf,amt); const p=amt-f-cost;
    rev+=amt; fees+=f; prof+=p;
    const r=t.insertRow(-1);
    if(animate&&i===step)r.className='new-row';
    r.innerHTML=`<td>${item}</td><td>${pf}</td><td>${$(amt)}</td>`+
      `<td${f===0?' class="gold"':''}>${f===0?"$0":$(f)}</td><td>${$(cost)}</td><td class="pos">${$(p)}</td>`;
  }
  document.getElementById('k0').textContent=step>=0?$(rev):'—';
  document.getElementById('k1').textContent=step>=0?$(fees):'—';
  document.getElementById('k2').textContent=step>=0?$(prof):'—';
}
const q=new URLSearchParams(location.search);
if(q.has('f')){ render(parseInt(q.get('f'))-1,false); }
else { let s=-1; setInterval(()=>{ s=s>=S.length+1?-1:s+1; render(Math.min(s,S.length-1),true); },950); }
</script></body></html>
